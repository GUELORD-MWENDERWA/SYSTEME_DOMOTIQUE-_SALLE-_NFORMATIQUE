<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuration WiFi - Domotique</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .config-container {
        background: white;
        border-radius: 15px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        width: 100%;
      }

      .config-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .config-header h1 {
        color: #667eea;
        font-size: 28px;
        margin-bottom: 8px;
      }

      .config-header p {
        color: #666;
        font-size: 14px;
      }

      .icon-box {
        font-size: 48px;
        margin-bottom: 15px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        color: #333;
        font-weight: 500;
        margin-bottom: 8px;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .submit-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .status {
        padding: 12px 15px;
        border-radius: 8px;
        margin-top: 20px;
        text-align: center;
        display: none;
        font-weight: 500;
      }

      .status.success {
        background: #e8f5e9;
        color: #2e7d32;
        border: 1px solid #4caf50;
      }

      .status.error {
        background: #ffebee;
        color: #c62828;
        border: 1px solid #f44336;
      }

      .status.loading {
        background: #e3f2fd;
        color: #1565c0;
        border: 1px solid #2196f3;
      }

      .info-box {
        background: #f5f5f5;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #666;
        border-left: 4px solid #667eea;
      }
    </style>
  </head>
  <body>
    <div class="config-container">
      <div class="config-header">
        <div class="icon-box">📡</div>
        <h1>Configuration WiFi</h1>
        <p>Connectez votre ESP32 au réseau</p>
      </div>

      <div class="info-box">
        <strong>ℹ️ Info :</strong> Entrez votre nom de réseau WiFi (SSID) et mot
        de passe. Le module se connectera automatiquement après configuration.
      </div>

      <form id="wifiForm">
        <div class="form-group">
          <label for="ssid">📶 Nom du réseau (SSID)</label>
          <input
            type="text"
            id="ssid"
            name="ssid"
            placeholder="Ex: MonReseau"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">🔐 Mot de passe</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Votre mot de passe WiFi"
            required
          />
        </div>

        <button type="submit" class="submit-btn">
          ✅ Configurer et Redémarrer
        </button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <script>
      const form = document.getElementById("wifiForm");
      const statusDiv = document.getElementById("status");

      function showStatus(message, type) {
        statusDiv.textContent = message;
        statusDiv.className = `status ${type}`;
        statusDiv.style.display = "block";
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const ssid = document.getElementById("ssid").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!ssid) {
          showStatus("❌ Le SSID ne peut pas être vide", "error");
          return;
        }

        if (!password) {
          showStatus("❌ Le mot de passe ne peut pas être vide", "error");
          return;
        }

        showStatus("⏳ Configuration en cours...", "loading");
        form.style.pointerEvents = "none";
        form.style.opacity = "0.5";

        try {
          const response = await fetch("/api/config/wifi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ssid, password }),
          });

          if (response.ok) {
            showStatus(
              "✅ Configuration réussie! Redémarrage en cours...",
              "success",
            );
            setTimeout(() => {
              document.body.innerHTML =
                '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-family:sans-serif;text-align:center;"><h2 style="font-size:32px;margin-bottom:20px;">⏳ Connexion en cours...</h2><p style="font-size:16px;">Veuillez patienter quelques secondes.</p><p style="font-size:12px;margin-top:20px;opacity:0.8;">L\'interface sera disponible à:<br>http://192.168.x.x ou http://domotique.local</p></div>';
            }, 2000);
          } else {
            const error = await response.text();
            showStatus(`❌ Erreur: ${error}`, "error");
            form.style.pointerEvents = "auto";
            form.style.opacity = "1";
          }
        } catch (error) {
          showStatus(`❌ Erreur de communication: ${error.message}`, "error");
          form.style.pointerEvents = "auto";
          form.style.opacity = "1";
        }
      });
    </script>
  </body>
</html>
